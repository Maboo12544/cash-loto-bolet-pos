<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071a4a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cash Loto POS" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Cash Loto Bolet POS</title>
  <style>
*{box-sizing:border-box}html,body{margin:0;background:#eef1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101827}.posapp{width:100%;max-width:520px;min-height:100dvh;margin:auto;background:#f6f7f9}.top{height:78px;background:#00d632;display:flex;align-items:center;gap:10px;padding:env(safe-area-inset-top) 12px 0}.icon{border:0;background:transparent;font-size:28px;font-weight:900}.brand{flex:1;text-align:center;font-weight:900;font-size:22px}.brand b{color:#ffd21a}.brand small{display:block;font-size:8px;letter-spacing:2px}.balance{text-align:center}.balance small{display:block;font-size:10px;font-weight:800}.balance strong{font-size:20px}.stats{height:66px;background:#142136;color:#aeb7c6;display:grid;grid-template-columns:repeat(4,1fr);text-align:center}.stats div{padding:8px 3px;border-right:1px solid #344052;font-size:11px;font-weight:800}.stats b{display:block;color:#fff;font-size:16px;margin-top:3px}.stats div:last-child b{color:#21e451}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px}.tabs button{border:0;border-radius:13px;padding:13px;font-size:17px;font-weight:900;color:#687080}.tabs .active{background:#00d632;color:#07140b}.tools{display:grid;grid-template-columns:1.7fr .55fr .55fr .55fr 1.35fr;gap:6px;padding:0 10px 9px}.tools button{min-height:43px;border:0;background:#fff;border-radius:22px;box-shadow:0 2px 7px #0002;font-size:15px}.draw{width:calc(100% - 20px);margin:0 10px 10px;min-height:68px;border:0;border-left:8px solid #ffd900;border-radius:15px;background:#fff;box-shadow:0 2px 8px #0002;position:relative;font-size:17px}.draw span{position:absolute;left:14px;top:20px}.draw b{display:block}.draw small{display:block;color:#667085}.draw em{color:red;font-style:normal}.draw i{position:absolute;right:16px;top:22px;font-size:22px}.inputs{display:grid;grid-template-columns:1.1fr .8fr .8fr;gap:7px;padding:0 10px 8px}.inputs input{width:100%;height:52px;border:2px solid #d2d6dc;border-radius:12px;text-align:center;font-size:22px;font-weight:800}.inputs input:first-child{border-color:#19bd48}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:0 7px}.keys button{height:61px;border:0;border-radius:7px;background:#172337;color:#fff;font-size:27px;font-weight:800}.keys .green,.keys .enter{background:#00db32;color:#07140b}.keys .muted{background:#aeb4bd}.keys .print{background:#18a957}.keys .cal{background:#7b31e8}.keys .dark{background:#172337}.keys .zero{grid-column:span 2}.keys .enter{grid-column:span 2;font-size:24px}footer{text-align:center;background:#fff;margin-top:7px;padding:10px 8px max(10px,env(safe-area-inset-bottom));font-size:13px;font-weight:700;color:#697386}@media(min-width:521px){body{background:#dfe4ea}.posapp{box-shadow:0 0 35px #0002}}@media print{.top,.stats,.tabs,.tools,.draw,.inputs,.keys,footer{display:none}}
</style>
</head>
<body>
<div class="posapp">
<header class="top"><button class="icon">☰</button><div class="brand">CASH <b>LOTO</b><small>PI PLIS POU OU</small></div><div class="balance"><small>BALANCE</small><strong id="balance">$707.58</strong></div><button class="icon">▥</button><button class="icon">⋮</button></header>
<section class="stats"><div>SALES<b id="sales">$1,032.00</b></div><div>COMMISSION<b>$0.00</b></div><div>PRIZE<b>$0.00</b></div><div>FINAL<b id="final">$707.58</b></div></section>
<section class="tabs"><button class="active">TICKET (<span id="tc">0</span>)</button><button>PLAYS ($ <span id="plays">0.00</span>)</button></section>
<section class="tools"><button>🎟️ <b>pos1</b></button><button onclick="window.print()">🖨️</button><button>$</button><button>▣</button><button>◷ <span id="clock"></span></button></section>
<button class="draw" id="drawBtn"><span>🟢</span><b id="drawName">FLORIDA PM</b><small>Closing : <em id="countdown">00:48:12</em></small><i>⌄</i></button>
<section class="inputs"><input id="number" inputmode="numeric" maxlength="4" autofocus><input id="amount" inputmode="decimal" value="0.00"><input id="limit" value="200" readonly></section>
<section class="keys">
<button class="print" onclick="window.print()">▣</button><button class="cal">▣</button><button class="muted">B</button><button class="dark">F</button>
<button class="muted" data-key=".">.</button><button class="muted">D</button><button class="muted">Q</button><button class="green" data-key="back">⌫</button>
<button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="green" data-key="/">/</button>
<button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button class="green" data-key="-">-</button>
<button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button class="green" data-key="+">+</button>
<button class="zero" data-key="0">0</button><button class="enter" id="enter">ENTER</button>
</section>
<footer>▣ &nbsp; Today's tickets &nbsp;⌃</footer>
</div>
<script>
const S='cashloto-active-pos-v1';let st=JSON.parse(localStorage.getItem(S)||'null')||{balance:707.58,sales:1032,tickets:[]};const save=()=>localStorage.setItem(S,JSON.stringify(st));
const num=document.getElementById('number'),amt=document.getElementById('amount');
function sync(){balance.textContent='$'+st.balance.toFixed(2);final.textContent='$'+st.balance.toFixed(2);sales.textContent='$'+st.sales.toFixed(2);tc.textContent=st.tickets.length;plays.textContent=st.tickets.reduce((a,t)=>a+t.amount,0).toFixed(2)}
document.querySelector('.keys').onclick=e=>{const k=e.target.dataset.key;if(!k)return;if(k==='back')num.value=num.value.slice(0,-1);else if(/^\d$/.test(k))num.value=(num.value+k).slice(0,4)};
enter.onclick=()=>{const n=num.value.trim(),a=Number(amt.value);if(!n)return alert('Antre nimewo a.');if(!a||a<=0)return alert('Antre montan an.');if(a>200)return alert('Limit pa fich se $200.');if(a>st.balance)return alert('Balance pa sifi.');st.balance-=a;st.sales+=a;st.tickets.unshift({number:n,amount:a,draw:drawName.textContent,at:new Date().toISOString()});save();sync();num.value='';amt.value='0.00';num.focus()};
setInterval(()=>clock.textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}),1000);sync();
</script>
</body>
</html>
