<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071a4a" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>Cash Loto Bolet POS</title>
  <style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#eef1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101827}
.posapp{width:100%;max-width:520px;height:100dvh;min-height:100dvh;margin:auto;background:#f6f7f9;overflow:hidden;display:flex;flex-direction:column;touch-action:manipulation}
.top{height:78px;background:linear-gradient(180deg,#1839e8 0%,#0879ef 55%,#08c9d7 100%);display:flex;align-items:center;gap:10px;padding:env(safe-area-inset-top) 12px 0}
.icon{border:0;background:transparent;font-size:28px;font-weight:900}.brand{flex:1;text-align:center;font-weight:900;font-size:22px}.brand b{color:#ffd21a}.brand small{display:block;font-size:8px;letter-spacing:2px}
.balance{text-align:center}.balance small{display:block;font-size:10px;font-weight:800}.balance strong{font-size:20px}
.stats{height:66px;background:#17326f;color:#aeb7c6;display:grid;grid-template-columns:repeat(4,1fr);text-align:center}.stats div{padding:8px 3px;border-right:1px solid #344052;font-size:11px;font-weight:800}.stats b{display:block;color:#fff;font-size:16px;margin-top:3px}.stats div:last-child b{color:#f4c542}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px}.tabs button{border:0;border-radius:13px;padding:13px;font-size:17px;font-weight:900;color:#687080}.tabs .active{background:#1769e8;color:#fff}
.tools{display:grid;grid-template-columns:1.7fr .55fr .55fr .55fr 1.35fr;gap:6px;padding:0 10px 9px}.tools button{min-height:43px;border:0;background:#fff;border-radius:22px;box-shadow:0 2px 7px #0002;font-size:15px}
.draw{width:calc(100% - 20px);margin:0 10px 8px;min-height:68px;border:0;border-left:8px solid #f4c542;border-radius:15px;background:#fff;box-shadow:0 2px 8px #0002;position:relative;font-size:17px}.draw span{position:absolute;left:14px;top:20px}.draw b{display:block}.draw small{display:block;color:#667085}.draw em{color:red;font-style:normal}.draw i{position:absolute;right:16px;top:22px;font-size:22px}
.timebar{margin:0 10px 8px;background:#0f172a;color:#e2e8f0;font-size:11px;padding:7px 10px;border-radius:10px;display:flex;justify-content:space-between}.timebar b{color:#86efac}
.clockwarn,.offbar{margin:0 10px 8px;font-size:11px;padding:7px 10px;border-radius:10px;font-weight:700;text-align:center}
.clockwarn{background:#fef3c7;color:#92400e}.offbar{background:#f59e0b;color:#111;display:none}.offbar.on{display:block}
.inputs{display:grid;grid-template-columns:1.1fr .8fr .8fr;gap:7px;padding:0 10px 8px}.inputs input{width:100%;height:52px;border:2px solid #d2d6dc;border-radius:12px;text-align:center;font-size:22px;font-weight:800}.inputs input:first-child{border-color:#1769e8}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:0 7px;flex:1;min-height:0}.keys button{height:auto;min-height:0;border:0;border-radius:7px;background:#15233d;color:#fff;font-size:27px;font-weight:800}.keys .green,.keys .enter{background:#1769e8}.keys .muted{background:#aeb4bd}.keys .print{background:#164ec9}.keys .cal{background:#c4a35a}.keys .zero{grid-column:span 2}.keys .enter{grid-column:span 2;font-size:24px}.keys button.selected{outline:3px solid #f4c542;outline-offset:-3px}
footer{flex:0 0 auto;text-align:center;background:#fff;margin-top:7px;padding:10px 8px max(10px,env(safe-area-inset-bottom));font-size:13px;font-weight:700;color:#697386}
.panel{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);max-height:70vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -10px 35px #0004;padding:16px;z-index:50}.panel.hidden{display:none}.panel h3{margin:0 0 10px}.panel .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.panel button{padding:9px 12px;border:0;border-radius:9px;background:#1769e8;color:#fff;font-weight:700;margin:4px 4px 0 0}
.wa{background:#25D366!important}.printb{background:#111!important}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;border:1px dashed #9ca3af;padding:12px;border-radius:8px;margin:8px 0}
@media print{.top,.stats,.tabs,.tools,.draw,.inputs,.keys,footer,.timebar,.clockwarn,.offbar,.panel button{display:none!important}.panel{position:static;transform:none;box-shadow:none;max-height:none}}
  @media(max-height:760px){.top{height:64px}.stats{height:56px}.tabs{padding:6px 10px}.tabs button{padding:9px}.tools{padding-bottom:6px}.tools button{min-height:36px}.draw{min-height:56px;margin-bottom:6px}.inputs input{height:44px}.keys{gap:4px}.keys button{font-size:23px}footer{padding-top:6px;padding-bottom:max(6px,env(safe-area-inset-bottom))}}
button{-webkit-tap-highlight-color:transparent;user-select:none}input{font-size:16px!important}
.gamepick{font-size:14px!important;background:#e8edf5!important;color:#142136!important}.gamepick.selected{background:#1769e8!important;color:#fff!important;outline:3px solid #f4c542;outline-offset:-3px}.keys .print,.keys .cal,.keys .muted{font-size:14px}
.gamebar{display:flex;gap:5px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}.gamebar::-webkit-scrollbar{display:none}.gamebar button{flex:1 0 auto;border:1px solid #d7dce5;background:#fff;color:#15233d;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:800}.gamebar button.active{background:#1769e8;color:#fff;border-color:#1769e8}
.finalkeys{grid-template-columns:repeat(4,1fr)!important}.finalkeys .zero{grid-column:span 3!important}.finalkeys .side{background:#1769e8!important;color:#fff!important;font-size:18px!important}.finalkeys .create{grid-column:1/-1!important;background:#1769e8!important;color:#fff!important;font-size:20px!important}.finalkeys button{min-height:58px}
</style>
</head>
<body>
<div class="posapp">

<section class="stats"><div>SALES<b id="sales">$0.00</b></div><div>COMMISSION<b id="comm">$0.00</b></div><div>PRIZE<b id="prize">$0.00</b></div><div>FINAL<b id="final">$0.00</b></div></section>
<section class="tabs"><button class="active" id="ticketTab">TICKET (<span id="tc">0</span>)</button><button id="playsTab">PLAYS ($ <span id="plays">0.00</span>)</button></section>
<section class="tools"><button id="posBtn">🎟️ <b>pos1</b></button><button id="printBtn">🖨️</button><button id="moneyBtn">$</button><button id="copyBtn">▣</button><button id="clockBtn">◷ <span id="clock"></span></button></section>
<div class="offbar" id="offbar">OFFLINE — vann yo ap senkronize apre</div>
<div class="timebar"><span id="phoneTime">Relòj tel</span><b id="serverTime">Lè sèvè ET</b></div>
<div class="clockwarn" id="clockwarn" style="display:none">Relòj telefòn lan pa bon. Fèmen vann sou lè sèvè.</div>
<button class="draw" id="drawBtn"><span>🟢</span><b id="drawName">FLORIDA PM</b><small>Closing : <em id="countdown">--:--:--</em></small><i>⌄</i></button>
<section class="gamebar"><button class="active" data-mode="B">Bolet</button><button data-mode="M">Mariage</button><button data-mode="P">Palé</button><button data-mode="3">Loto 3</button><button data-mode="4">Loto 4</button></section>
<section class="inputs"><input id="number" inputmode="none" readonly maxlength="4" aria-label="Nimewo"><input id="limit" value="200" readonly aria-label="Disponib"><input id="amount" inputmode="none" readonly value="0.00" aria-label="Montan"></section>
<section class="keys finalkeys">
<button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="side" id="enter">ENTER</button>
<button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button class="side" data-key="back">EFASE</button>
<button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button class="side" data-mode="BP">BP</button>
<button class="zero" data-key="0">0</button><button class="side" data-mode="P">P</button>
<button class="create" id="createTicket">KREYE TIKÈ</button>
</section>
<footer id="todayBtn">▣ Today's tickets</footer>
<div id="panel" class="panel hidden"></div>
</div>
<script>
const S='cashloto-active-pos-v4';
let st=JSON.parse(localStorage.getItem(S)||'null')||{balance:707.58,sales:0,tickets:[],cart:[],mode:'B',draw:'FLORIDA PM'};
const save=()=>localStorage.setItem(S,JSON.stringify(st));
const el=id=>document.getElementById(id);
const num=el('number'), amt=el('amount'), panel=el('panel');
const fmt=n=>'$'+Number(n||0).toFixed(2);
let field='number',marriageFirst='';
num.onclick=()=>field='number'; amt.onclick=()=>field='amount';
const DRAWS={'FLORIDA AM':[13,15],'FLORIDA PM':[21,30],'NEW YORK AM':[14,15],'NEW YORK PM':[22,15],'GEORGIA AM':[12,15],'GEORGIA PM':[18,45],'CONNECTICUT AM':[13,20],'CONNECTICUT PM':[22,15]};
function maxLen(){return 4}
function resolvedMode(n){
  if(st.mode==='4') return '4';
  if(st.mode==='3') return '3';
  if(st.mode==='M') return 'M';
  if(st.mode==='P') return 'P';
  if(n.length===2) return 'B';
  if(n.length===3) return '3';
  if(n.length===4) return 'M';
  return st.mode||'B';
}

const UUIDS=['000018f0-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455','6e400001-b5a3-f393-e0a9-e50e24dcca9e','e7810a71-73ae-499d-8c15-faa9aef0c3f2'];
let bt={dev:null,ch:null,name:localStorage.getItem('escpos-name')||''};
function enc(s){const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&255;return a}
function merge(parts){const n=parts.reduce((a,p)=>a+p.length,0);const o=new Uint8Array(n);let i=0;parts.forEach(p=>{o.set(p,i);i+=p.length});return o}
function ticketBytes(list){
  const tot=list.reduce((a,t)=>a+t.amount,0);
  const L=['CASH LOTO','** ORIGINAL **','PDV pos1',st.draw,'--------------------','BOUL          PWEN'];
  list.forEach(t=>L.push((t.number+'          ').slice(0,12)+fmt(t.amount)));
  L.push('--------------------','TOTAL     '+fmt(tot),'58mm ESC/POS','');
  return merge([
    new Uint8Array([0x1B,0x40,0x1C,0x2E,0x1B,0x61,0x01,0x1B,0x21,0x00]),
    enc(L.join('\n')+'\n\n\n'),
    new Uint8Array([0x1D,0x56,0x00])
  ]);
}
async function findWrite(server){
  const svcs=await server.getPrimaryServices();
  for(const s of svcs){
    const chs=await s.getCharacteristics();
    for(const c of chs){ if(c.properties.write||c.properties.writeWithoutResponse) return c; }
  }
  throw new Error('Pa jwenn kanal write');
}
async function btConnect(){
  if(!navigator.bluetooth) throw new Error('Web Bluetooth pa disponib. Itilize Chrome Android / Edge.');
  const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:UUIDS});
  const server=await dev.gatt.connect();
  bt.ch=await findWrite(server); bt.dev=dev; bt.name=dev.name||'Enprimant';
  localStorage.setItem('escpos-name',bt.name);
}
async function btWrite(bytes){
  if(!bt.ch) await btConnect();
  const chunk=20;
  for(let i=0;i<bytes.length;i+=chunk){
    const sl=bytes.slice(i,i+chunk);
    if(bt.ch.properties.writeWithoutResponse) await bt.ch.writeValueWithoutResponse(sl);
    else await bt.ch.writeValue(sl);
  }
}
async function printEscpos(list){
  try{ await btWrite(ticketBytes(list)); alert('Voye sou enprimant: '+(bt.name||'')); }
  catch(e){ if(!confirm(e.message+'\nEnprime sou telefòn?')) return; window.print(); }
}

function sync(){
  el('balance').textContent=fmt(st.balance); el('final').textContent=fmt(st.balance);
  el('sales').textContent=fmt(st.sales); el('comm').textContent=fmt(st.sales*0.1);
  el('tc').textContent=st.tickets.length;
  el('plays').textContent=st.cart.reduce((a,t)=>a+t.amount,0).toFixed(2);
  el('drawName').textContent=st.draw;
  document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('selected',b.dataset.mode===st.mode);b.classList.toggle('active',b.dataset.mode===st.mode)});
  el('offbar').classList.toggle('on',!navigator.onLine);
}
function rows(a){return a.length?a.map(t=>'<div class="row"><span><b>'+t.number+'</b> · '+t.draw+' · '+t.mode+'</span><b>'+fmt(t.amount)+'</b></div>').join(''):'<p>Pa gen tikè.</p>'}
function show(t,h){panel.innerHTML='<h3>'+t+'</h3>'+h+'<p><button id="closePanel">Fèmen</button></p>';panel.classList.remove('hidden');el('closePanel').onclick=()=>panel.classList.add('hidden')}
function receiptHtml(list){
  const lines=list.map(t=>'<div class="row"><span>'+t.number+'</span><b>'+fmt(t.amount)+'</b></div>').join('');
  const tot=list.reduce((a,t)=>a+t.amount,0);
  return '<div class="receipt"><h3>** ORIGINAL **</h3><div class="row"><span>PDV</span><b>pos1</b></div><div class="row"><span>Tiraj</span><b>'+st.draw+'</b></div><div class="row"><span>BOUL</span><b>PWEN</b></div>'+lines+'<div class="row"><span>TOTAL FICH</span><b>'+fmt(tot)+'</b></div></div>';
}
function afterTicket(list){
  show('Fich kreye', receiptHtml(list)+
    '<button class="printb" id="pBt">Enprime ESC/POS</button>'+
    '<button class="printb" id="p1">Enprime telefòn</button>'+
    '<button class="wa" id="wa1">WhatsApp</button>');
  el('pBt').onclick=()=>printEscpos(list);
  el('p1').onclick=()=>window.print();
  el('wa1').onclick=()=>{const tot=list.reduce((a,t)=>a+t.amount,0);location.href='https://wa.me/?text='+encodeURIComponent('Cash Loto '+st.draw+'\n'+list.map(t=>t.number+' = '+fmt(t.amount)).join('\n')+'\nTotal '+fmt(tot));};
}
function printerPanel(){
  show('Paramèt Enprimant',
    '<div class="row"><span>Web Bluetooth</span><b>'+(navigator.bluetooth?'Wi':'Non')+'</b></div>'+
    '<div class="row"><span>Machin</span><b>'+(bt.name||'Pa konekte')+'</b></div>'+
    '<div class="row"><span>Papye</span><b>58 mm · 32 kar</b></div>'+
    '<div class="row"><span>Kòd</span><b>ESC/POS · CP1252</b></div>'+
    '<button id="btPair">Konekte Bluetooth</button>'+
    '<button id="btTest">Tès enprime</button>');
  el('btPair').onclick=()=>btConnect().then(()=>alert('Konekte: '+bt.name)).catch(e=>alert(e.message));
  el('btTest').onclick=()=>printEscpos([{number:'00',amount:0,draw:st.draw}]);
}
document.querySelector('.keys').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  const k=b.dataset.key,m=b.dataset.mode;
  if(m){st.mode=m;marriageFirst='';num.value='';field='number';save();sync();return}
  if(k==='back'){ if(field==='amount') amt.value=amt.value.length>1?amt.value.slice(0,-1):'0'; else num.value=num.value.slice(0,-1); }
  else if(/^\d$/.test(k)){if(field==='amount'){amt.value=(amt.value==='0.00'||amt.value==='0')?k:amt.value+k}else{num.value=(num.value+k).slice(0,4)}}
  else if(k==='.'){ field='amount'; if(!String(amt.value).includes('.')) amt.value+='.'; }
  else if(k==='+') amt.value=((+amt.value||0)+1).toFixed(2);
  else if(k==='-') amt.value=Math.max(0,(+amt.value||0)-1).toFixed(2);
  else if(k==='/') amt.value=((+amt.value||0)/2).toFixed(2);
};
el('enter').onclick=()=>{
  let n=num.value.trim(),a=Number(amt.value);
  if(!n)return alert('Antre boul la.');
  const mode=resolvedMode(n);
  if(mode==='B'&&n.length!==2)return alert('Bolet = 2 chif.');
  if(mode==='3'&&n.length!==3)return alert('Loto 3 = 3 chif.');
  if(mode==='4'&&n.length!==4)return alert('Loto 4 = 4 chif.');
  if(mode==='M'&&n.length!==4)return alert('Mariage = 4 chif (2 boul).');
  if(mode==='P'&&n.length!==2)return alert('Palé = 2 chif.');
  if(!a||a<=0){a=Number(st.lastAmount||0);if(!a){field='amount';return alert('Antre montan an.');}amt.value=a.toFixed(2);}
  const available=Number(el('limit').value)||0;
  if(a>available)return alert('Montan disponib se '+fmt(available)+'.');
  if(a>st.balance)return alert('Balance pa sifi.');
  const displayNumber=mode==='M'?n.slice(0,2)+'-'+n.slice(2):n;
  const t={id:Date.now(),number:displayNumber,amount:a,draw:st.draw,mode,at:new Date().toISOString()};
  st.lastAmount=a;st.balance-=a;st.sales+=a;st.tickets.unshift(t);st.cart.push(t);save();sync();
  num.value='';amt.value=a.toFixed(2);field='number';
};
el('drawBtn').onclick=()=>show('Chwazi tiraj',Object.keys(DRAWS).map(d=>'<div class="row"><span>'+d+'</span><button data-draw="'+d+'">Chwazi</button></div>').join(''));
panel.onclick=e=>{const d=e.target.dataset.draw;if(d){st.draw=d;save();sync();panel.classList.add('hidden');return}if(e.target.id==='printerOpen')printerPanel()};
el('ticketTab').onclick=()=>show('Tikè',rows(st.tickets));
el('playsTab').onclick=()=>show('Plays',rows(st.cart)+receiptHtml(st.cart));
el('todayBtn').onclick=()=>show("Today's tickets",rows(st.tickets.filter(t=>new Date(t.at).toDateString()===new Date().toDateString())));
el('printBtn').onclick=()=>{if(!st.cart.length)return alert('Pa gen fich.');afterTicket(st.cart)};
el('moneyBtn').onclick=()=>show('Balance','<div class="row"><span>Balance</span><b>'+fmt(st.balance)+'</b></div>');
el('copyBtn').onclick=async()=>{const t=st.tickets[0];if(!t)return alert('Pa gen tikè.');try{await navigator.clipboard.writeText('Cash Loto '+t.number+' '+fmt(t.amount));alert('Kopye')}catch(e){alert(e.message)}};
el('posBtn').onclick=()=>show('POS','<div class="row"><span>PDV</span><b>pos1</b></div>');
el('menuBtn').onclick=()=>show('Menu','<div class="row"><span>POS</span><b>pos1</b></div><div class="row"><span>Tikè jodi a</span><b>'+st.tickets.length+'</b></div><button id="printerOpen">Enprimant</button>');
el('reportBtn').onclick=()=>show('Rapò','<div class="row"><span>Sales</span><b>'+fmt(st.sales)+'</b></div>');
el('moreBtn').onclick=()=>printerPanel();
el('clockBtn').onclick=()=>alert(new Date().toLocaleString());
function tick(){
  const now=new Date(), et=new Date(now.toLocaleString('en-US',{timeZone:'America/New_York'}));
  el('phoneTime').textContent='Tel '+now.toLocaleTimeString();
  el('serverTime').textContent='Sèvè '+et.toLocaleTimeString()+' ET';
  el('clockwarn').style.display=Math.abs(now-et)>5*60*1000?'block':'none';
  const hhmm=DRAWS[st.draw]; if(!hhmm) return;
  const close=new Date(et); close.setHours(hhmm[0],hhmm[1],0,0);
  let sec=Math.max(0,Math.floor((close-et)/1000));
  el('countdown').textContent=[Math.floor(sec/3600),Math.floor(sec%3600/60),sec%60].map(x=>String(x).padStart(2,'0')).join(':');
  el('clock').textContent=et.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(tick,1000);tick();sync();
window.addEventListener('online',sync);window.addEventListener('offline',sync);
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

el('createTicket').onclick=()=>{if(!st.cart.length)return alert('Pa gen play pou kreye tikè.');const list=[...st.cart];const total=list.reduce((a,t)=>a+t.amount,0);show('Tikè pare',receiptHtml(list)+'<button class="printb" id="finalPrint">Enprime</button><button class="wa" id="finalWa">WhatsApp</button>');el('finalPrint').onclick=()=>printEscpos(list);el('finalWa').onclick=()=>{location.href='https://wa.me/?text='+encodeURIComponent('Cash Loto '+st.draw+'\n'+list.map(t=>t.number+' = '+fmt(t.amount)).join('\n')+'\nTotal '+fmt(total))};st.cart=[];save();sync();};
</script>
</body>
</html>
