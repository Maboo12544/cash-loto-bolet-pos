<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#071a4a"/>
<link rel="manifest" href="./manifest.webmanifest"/>
<title>Cash Loto Bolet POS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8ecf2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101827}
.posapp{width:100%;max-width:520px;height:100dvh;margin:auto;background:#f4f6f9;display:flex;flex-direction:column}
.stats{flex:0 0 52px;background:#17326f;color:#9aa6b8;display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.stats div{padding:6px 2px;border-right:1px solid #344052;font-size:9px;font-weight:800;letter-spacing:.4px}
.stats b{display:block;color:#fff;font-size:14px;margin-top:2px}.stats div:last-child b{color:#f4c542}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 10px 6px}
.tabs button{border:0;border-radius:12px;padding:10px;font-size:15px;font-weight:900;color:#687080;background:#e8edf4}
.tabs .active{background:#1769e8;color:#fff}
.tools{display:grid;grid-template-columns:1.6fr .5fr .5fr .5fr 1.2fr;gap:6px;padding:0 10px 6px}
.tools button{min-height:36px;border:0;background:#fff;border-radius:20px;box-shadow:0 2px 6px #0001;font-size:13px}
.draw{width:calc(100% - 20px);margin:0 10px 6px;min-height:50px;border:0;border-left:7px solid #f4c542;border-radius:12px;background:#fff;box-shadow:0 2px 6px #0001;position:relative;text-align:left;padding:8px 36px 8px 40px}
.draw span{position:absolute;left:12px;top:14px}.draw small{display:block;color:#667085;font-size:12px}.draw em{color:#dc2626;font-style:normal;font-weight:800}.draw i{position:absolute;right:12px;top:14px}
.offbar{display:none;margin:0 10px 6px;background:#f59e0b;padding:6px;border-radius:8px;text-align:center;font-weight:800;font-size:12px}.offbar.on{display:block}
.gamebar{display:flex;gap:5px;padding:0 10px 6px}.gamebar button{flex:1;border:1px solid #d7dce5;background:#fff;border-radius:9px;padding:7px 4px;font-size:11px;font-weight:800}.gamebar button.active{background:#1769e8;color:#fff;border-color:#1769e8}
.inputs{display:grid;grid-template-columns:1.2fr .7fr .8fr;gap:6px;padding:0 10px 4px}
.field{display:flex;flex-direction:column;gap:3px}.field span{font-size:10px;font-weight:800;color:#64748b;padding-left:4px}
.field input{width:100%;height:44px;border:2px solid #d2d6dc;border-radius:10px;text-align:center;font-size:20px;font-weight:800;background:#fff}
.field input.on{border-color:#1769e8;box-shadow:0 0 0 3px #1769e833}
.mini{margin:0 10px 4px;min-height:22px;font-size:12px;font-weight:700;color:#334155;white-space:nowrap;overflow:auto}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:0 8px;flex:1;min-height:0}
.keys button{border:0;border-radius:8px;background:#15233d;color:#fff;font-size:22px;font-weight:800}
.keys .side,.keys .create{background:#1769e8;font-size:16px}
.keys .create{grid-column:1/-1;font-size:18px}
footer{text-align:center;background:#fff;padding:7px 8px max(7px,env(safe-area-inset-bottom));font-size:12px;font-weight:700;color:#697386}
.panel{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);max-height:72vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -10px 35px #0004;padding:16px;z-index:50}
.panel.hidden{display:none}.panel .row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}
.panel button{padding:10px 12px;border:0;border-radius:9px;background:#1769e8;color:#fff;font-weight:800;margin:4px 4px 0 0}
.wa{background:#25D366!important}.printb{background:#111!important}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;border:1px dashed #9ca3af;padding:12px;border-radius:8px;margin:8px 0}
button{-webkit-tap-highlight-color:transparent;user-select:none}
</style>
</head>
<body>
<div class="posapp">
<section class="stats">
<div>VANT<b id="sales">$0.00</b></div>
<div>KOMISYON<b id="comm">$0.00</b></div>
<div>PRIZE<b id="prize">$0.00</b></div>
<div>FINAL<b id="final">$0.00</b></div>
</section>
<section class="tabs">
<button class="active" id="ticketTab">TIKÈ (<span id="tc">0</span>)</button>
<button id="playsTab">JWE ($ <span id="plays">0.00</span>)</button>
</section>
<section class="tools">
<button id="posBtn">pos1</button>
<button id="printBtn">🖨️</button>
<button id="moneyBtn">$</button>
<button id="copyBtn">▣</button>
<button id="clockBtn"><span id="clock">--:--</span></button>
</section>
<div class="offbar" id="offbar">OFFLINE</div>
<button class="draw" id="drawBtn"><span>🟢</span><b id="drawName">FLORIDA PM</b><small>Fèmen : <em id="countdown">00:00:00</em></small><i>⌄</i></button>
<section class="gamebar" id="gamebar">
<button class="active" data-mode="B">Bolet</button>
<button data-mode="M">Mariage</button>
<button data-mode="PA">Palé</button>
<button data-mode="3">Loto 3</button>
<button data-mode="4">Loto 4</button>
</section>
<section class="inputs">
<label class="field"><span>BOUL</span><input id="number" inputmode="none" readonly class="on"></label>
<label class="field"><span>LIMIT</span><input id="limit" value="200" readonly></label>
<label class="field"><span>PWEN</span><input id="amount" inputmode="none" readonly value="0.00"></label>
</section>
<section class="keys" id="keys">
<button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="side" id="enter">ENTER</button>
<button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button class="side" data-key="back">EFASE</button>
<button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button class="side" data-key=".">.</button>
<button data-key="0">0</button><button class="side" data-act="pwen">P</button>
<button class="create" id="createTicket">KREYE TIKÈ</button>
</section>
<footer id="todayBtn">Tikè jodi a</footer>
<div id="panel" class="panel hidden"></div>
</div>
<script>
const S='cashloto-active-pos-v6';
let st=JSON.parse(localStorage.getItem(S)||'null')||{balance:707.58,sales:0,tickets:[],cart:[],mode:'B',draw:'FLORIDA PM',lastAmount:0};
const save=()=>localStorage.setItem(S,JSON.stringify(st));
const el=id=>document.getElementById(id);
const on=(id,fn)=>{const n=el(id);if(n)n.onclick=fn};
const num=el('number'),amt=el('amount'),panel=el('panel');
const fmt=n=>'$'+Number(n||0).toFixed(2);
let field='number';
const DRAWS={'FLORIDA AM':[13,15],'FLORIDA PM':[21,30],'NEW YORK AM':[14,15],'NEW YORK PM':[22,15],'GEORGIA AM':[12,15],'GEORGIA PM':[18,45],'CONNECTICUT AM':[13,20],'CONNECTICUT PM':[22,15]};
function isPair(){return st.mode==='M'||st.mode==='PA'}
function needLen(){return isPair()||st.mode==='4'?4:st.mode==='3'?3:2}
function setField(f){
  field=f;
  num.classList.toggle('on',f==='number');
  amt.classList.toggle('on',f==='amount');
}
function pretty(n){
  n=String(n||'').replace(/\D/g,'');
  if(isPair()&&n.length>2) return n.slice(0,2)+'-'+n.slice(2,4);
  return n;
}
function setMode(m){st.mode=m;num.value='';setField('number');save();sync()}
function sync(){
  el('final').textContent=fmt(st.balance);
  el('sales').textContent=fmt(st.sales);
  el('comm').textContent=fmt(st.sales*0.1);
  el('tc').textContent=st.cart.length;
  el('plays').textContent=st.cart.reduce((a,t)=>a+t.amount,0).toFixed(2);
  el('drawName').textContent=st.draw;
  document.querySelectorAll('#gamebar [data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===st.mode));
  el('offbar').classList.toggle('on',!navigator.onLine);
  
}
function rows(a){return a.length?a.map(t=>'<div class="row"><span><b>'+t.number+'</b> · '+t.draw+'</span><b>'+fmt(t.amount)+'</b></div>').join(''):'<p>Pa gen tikè.</p>'}
function show(t,h){panel.innerHTML='<h3>'+t+'</h3>'+h+'<p><button id="closePanel">Fèmen</button></p>';panel.classList.remove('hidden');on('closePanel',()=>panel.classList.add('hidden'))}
function receiptHtml(list){
  const tot=list.reduce((a,t)=>a+t.amount,0);
  return '<div class="receipt"><h3>** ORIGINAL **</h3><div class="row"><span>Tiraj</span><b>'+st.draw+'</b></div><div class="row"><span>BOUL</span><b>PWEN</b></div>'+list.map(t=>'<div class="row"><span>'+t.number+'</span><b>'+fmt(t.amount)+'</b></div>').join('')+'<div class="row"><span>TOTAL FICH</span><b>'+fmt(tot)+'</b></div></div>';
}
function addPlay(){
  let n=num.value.replace(/\D/g,''),a=Number(amt.value);
  if(!n) return alert('Antre boul la.');
  if(n.length!==needLen()) return alert(isPair()?'Mariage / Pale = 2 boul (4 chif)':st.mode==='B'?'Bolet = 2 chif':st.mode==='3'?'Loto 3 = 3 chif':'Loto 4 = 4 chif');
  if(!a||a<=0){a=Number(st.lastAmount||0);if(!a){setField('amount');return alert('Peze P epi antre pwen an.');}amt.value=a.toFixed(2);}
  if(a>Number(el('limit').value||200)) return alert('Depase limit.');
  if(a>st.balance) return alert('Balans pa sifi.');
  const t={id:Date.now(),number:pretty(n),amount:a,draw:st.draw,mode:isPair()?'M':st.mode,at:new Date().toISOString()};
  st.lastAmount=a;st.balance-=a;st.sales+=a;st.cart.push(t);save();sync();
  num.value='';setField('number');
}
function finishTicket(){
  if(!st.cart.length) return alert('ENTER boul la anvan.');
  const list=[...st.cart];
  list.forEach(t=>st.tickets.unshift(t));
  st.cart=[];save();sync();
  show('Tikè pare',receiptHtml(list)+'<button class="printb" id="finalPrint">Enprime</button><button class="wa" id="finalWa">WhatsApp</button>');
  on('finalPrint',()=>window.print());
  on('finalWa',()=>{const tot=list.reduce((a,t)=>a+t.amount,0);location.href='https://wa.me/?text='+encodeURIComponent('Cash Loto '+st.draw+'\n'+list.map(t=>t.number+' = '+fmt(t.amount)).join('\n')+'\nTotal '+fmt(tot));});
}
num.onclick=()=>setField('number');
amt.onclick=()=>setField('amount');
el('gamebar').onclick=e=>{const b=e.target.closest('[data-mode]');if(b)setMode(b.dataset.mode);};
el('keys').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='enter'||b.id==='createTicket')return;
  if(b.dataset.act==='pwen'){setField('amount');if(amt.value==='0.00')amt.value='';return;}
  const k=b.dataset.key;
  if(k==='back'){
    if(field==='amount') amt.value=amt.value.length>1?amt.value.slice(0,-1):'0';
    else num.value=pretty(num.value.replace(/\D/g,'').slice(0,-1));
    return;
  }
  if(k==='.'){
    setField('amount');
    if(!String(amt.value).includes('.')) amt.value=(amt.value||'0')+'.';
    return;
  }
  if(/^\d$/.test(k)){
    if(field==='amount'){
      if(amt.value==='0.00'||amt.value==='0') amt.value=k;
      else amt.value+=k;
    } else {
      const raw=(num.value.replace(/\D/g,'')+k).slice(0,needLen());
      num.value=pretty(raw);
      if(raw.length>=needLen()) setField('amount');
    }
  }
};
on('enter',addPlay);
on('createTicket',finishTicket);
on('drawBtn',()=>show('Chwazi tiraj',Object.keys(DRAWS).map(d=>'<div class="row"><span>'+d+'</span><button data-draw="'+d+'">Chwazi</button></div>').join('')));
panel.onclick=e=>{const d=e.target.dataset.draw;if(d){st.draw=d;save();sync();panel.classList.add('hidden');}};
on('ticketTab',()=>show('Tikè',rows(st.tickets)));
on('playsTab',()=>show('Jwe',rows(st.cart)+receiptHtml(st.cart)));
on('todayBtn',()=>show('Tikè jodi a',rows(st.tickets.filter(t=>new Date(t.at).toDateString()===new Date().toDateString()))));
on('printBtn',()=>{if(!st.cart.length)return alert('Pa gen fich.');finishTicket();});
on('moneyBtn',()=>show('Balans','<div class="row"><span>Balans</span><b>'+fmt(st.balance)+'</b></div>'));
on('copyBtn',async()=>{const t=st.tickets[0]||st.cart[0];if(!t)return alert('Pa gen tikè.');try{await navigator.clipboard.writeText(t.number+' '+fmt(t.amount));alert('Kopye')}catch(err){alert(err.message)}});
on('posBtn',()=>show('POS','<div class="row"><span>PDV</span><b>pos1</b></div>'));
on('clockBtn',()=>alert(new Date().toLocaleString()));
function tick(){
  const now=new Date();
  const et=new Date(now.toLocaleString('en-US',{timeZone:'America/New_York'}));
  const hhmm=DRAWS[st.draw]; if(!hhmm) return;
  const close=new Date(et); close.setHours(hhmm[0],hhmm[1],0,0);
  let sec=Math.max(0,Math.floor((close-et)/1000));
  el('countdown').textContent=[Math.floor(sec/3600),Math.floor(sec%3600/60),sec%60].map(x=>String(x).padStart(2,'0')).join(':');
  if(el('clock')) el('clock').textContent=et.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
setInterval(tick,1000);tick();sync();setField('number');
window.addEventListener('online',sync);window.addEventListener('offline',sync);
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
