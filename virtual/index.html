<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#071018"/>
  <meta name="description" content="Cash Paryaj — jwèt vityèl demonstrasyon"/>
  <title>Jwèt vityèl · Cash Paryaj</title>
  <link rel="stylesheet" href="./css/games.css"/>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-btn" type="button" id="menuBtn" aria-label="Meni">☰</button>
      <div class="brand">
        <b>Cash Paryaj</b>
        <small>Jwèt vityèl</small>
      </div>
      <button class="icon-btn" type="button" id="userBtn" aria-label="Kont">👤</button>
      <div class="credit-float" title="Kredi vityèl demonstrasyon">
        <small>Kredi vityèl</small>
        <b><span id="creditValue">1000</span></b>
      </div>
    </header>

    <div id="statusBar" class="status-bar" role="status"></div>
    <main id="app"></main>

    <nav class="bottom-nav" aria-label="Navigasyon">
      <button type="button" data-nav="hub" id="navHub">Akèy</button>
      <button type="button" data-nav="game" id="navGames">Jwèt</button>
      <button type="button" data-nav="info" id="navInfo">Enfo</button>
    </nav>
  </div>

  <!-- Modal koneksyon — estrikti tankou demo, mak Cash Paryaj -->
  <div id="authGate" class="auth-backdrop" hidden>
    <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <div class="auth-head">
        <h2 id="authTitle">KONEKTE</h2>
        <button class="icon-btn" type="button" id="authClose" aria-label="Fèmen" style="width:34px;height:34px">✕</button>
      </div>
      <div class="auth-body">
        <div class="field">
          <label for="authEmail">Imèl</label>
          <input id="authEmail" type="email" autocomplete="username" placeholder="ou@imel.com"/>
        </div>
        <div class="field" id="passField">
          <label for="authPass">Modpas</label>
          <div style="display:flex;align-items:center;gap:8px">
            <input id="authPass" type="password" autocomplete="current-password" style="flex:1;background:transparent;border:0;outline:0;color:inherit;font-size:15px;font-weight:600"/>
            <button type="button" id="togglePass" aria-label="Montre modpas" style="opacity:.8">👁</button>
          </div>
        </div>
        <div class="auth-row">
          <label><input type="checkbox" id="rememberMe"/> Sonje m</label>
          <a href="#" id="forgotLink">Bliye modpas?</a>
        </div>
        <button class="auth-btn primary" type="button" id="signInBtn">👤 Konekte</button>
        <button class="auth-btn secondary" type="button" id="registerBtn">👤 Enskri</button>
        <p class="auth-note">Sesyon demonstrasyon sèlman · pa gen depo/retrè · kredi vityèl</p>
      </div>
    </div>
  </div>

  <div id="modalHost"></div>

  <button type="button" id="soundBtn" class="hidden" aria-hidden="true">🔊</button>

  <script src="./js/core.js"></script>
  <script src="./js/art.js"></script>
  <script src="./js/lucky-six.js"></script>
  <script src="./js/roulette.js"></script>
  <script src="./js/keno.js"></script>
  <script src="./js/dog-race.js"></script>
  <script src="./js/horse-race.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
